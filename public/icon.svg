<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Glowing 3D Printer / Isometric Cube Graphic -->
  <g filter="url(#glow)" transform="translate(256, 230)">
    <!-- Top Face of Isometric Cube -->
    <polygon points="0,-100 90,-50 0,0 -90,-50" fill="url(#emeraldGrad)"/>
    
    <!-- Left Face -->
    <polygon points="-90,-50 0,0 0,105 -90,55" fill="#047857"/>
    
    <!-- Right Face -->
    <polygon points="0,0 90,-50 90,55 0,105" fill="#065f46"/>

    <!-- 3D Print Layer Lines (Left) -->
    <line x1="-90" y1="-15" x2="0" y2="35" stroke="#10b981" stroke-width="3" opacity="0.6"/>
    <line x1="-90" y1="20" x2="0" y2="70" stroke="#10b981" stroke-width="3" opacity="0.6"/>

    <!-- 3D Print Layer Lines (Right) -->
    <line x1="0" y1="35" x2="90" y2="-15" stroke="#34d399" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="70" x2="90" y2="20" stroke="#34d399" stroke-width="3" opacity="0.6"/>

    <!-- Extruder Nozzle above cube -->
    <path d="M -24,-150 L 24,-150 L 16,-120 L 4,-108 L -4,-108 L -16,-120 Z" fill="#f4f4f5"/>
    <!-- Filament line going into nozzle -->
    <line x1="0" y1="-180" x2="0" y2="-150" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <!-- Laser / heat bead -->
    <circle cx="0" cy="-105" r="4" fill="#6ee7b7"/>
  </g>

  <!-- Brand Text: PrintFlow -->
  <text x="256" y="420" font-family="'Inter', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1">PRINTFLOW</text>
  <text x="256" y="455" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#10b981" text-anchor="middle" letter-spacing="4">3D MANAGER</text>
</svg>
