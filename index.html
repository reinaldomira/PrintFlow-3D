<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PrintFlow - 3D Sales Manager</title>
    <meta name="description" content="A complete management system for 3D printing businesses with cost calculators, customer tracking, and visual sales reports.">
    <meta property="og:title" content="PrintFlow - 3D Sales Manager">
    <meta property="og:description" content="A complete management system for 3D printing businesses with cost calculators, customer tracking, and visual sales reports.">
    <meta property="og:type" content="website">
    
    <!-- Cabeçalhos de Segurança (Client-Side Meta Tags) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co blob: data:; object-src 'none'; base-uri 'self';">
    
    <!-- Configurações para Web App Nativo / PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PrintFlow">
    <meta name="theme-color" content="#09090b">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/neon-favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/neon-logo-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/neon-logo-512.png">
    <link rel="apple-touch-icon" href="/icons/neon-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/neon-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/neon-logo-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/neon-logo-512.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
        }
        #root { 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Oculta setas/steppers nativos de input number em todos os navegadores */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none !important;
            margin: 0 !important;
        }
        input[type=number] {
            -moz-appearance: textfield !important;
            appearance: textfield !important;
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            body * {
                visibility: hidden;
            }
            #quote-printable-sheet, #quote-printable-sheet * {
                visibility: visible;
            }
            #quote-printable-sheet {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 8mm !important;
                box-shadow: none !important;
                border: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
