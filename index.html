<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PrintFlow - 3D Sales Manager</title>
    <meta name="description" content="A complete management system for 3D printing businesses with cost calculators, customer tracking, and visual sales reports.">
    <meta property="og:title" content="PrintFlow - 3D Sales Manager">
    <meta property="og:description" content="A complete management system for 3D printing businesses with cost calculators, customer tracking, and visual sales reports.">
    <meta property="og:type" content="website">
    
    <!-- Configurações para Web App Nativo / PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PrintFlow">
    <meta name="theme-color" content="#09090b">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/neon-favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/neon-logo-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/neon-logo-512.png">
    <link rel="apple-touch-icon" href="/icons/neon-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/neon-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/neon-logo-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/neon-logo-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
        }
        #root { 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            body * {
                visibility: hidden;
            }
            #quote-printable-sheet, #quote-printable-sheet * {
                visibility: visible;
            }
            #quote-printable-sheet {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 8mm !important;
                box-shadow: none !important;
                border: none !important;
            }
        }
    </style>

    <script>
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Service worker registration for PWA installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('PrintFlow ServiceWorker registrado com sucesso:', registration.scope);
            })
            .catch((error) => {
              console.warn('Falha ao registrar ServiceWorker:', error);
            });
        });
      }
    </script>
</body>
</html>
